# Exact-build manifest generated from a device diagnostic report. All values
# are mandatory when packaging a front/back replacement adapter.
manufacturer=Google
product=redfin
device=redfin
api=34
system_fingerprint_sha256=<sha256-of-ro.build.fingerprint-without-newline>
vendor_fingerprint_sha256=<sha256-of-ro.vendor.build.fingerprint-without-newline>
cameraserver_sha256=<sha256-of-/system/bin/cameraserver>
camera_provider_sha256=<aggregate-sha256-described-in-docs/DEVICE-PROFILING.md>
graphics_stack_sha256=<aggregate-sha256-of-vendor-mapper-and-allocator-files>
adapter_sha256=<sha256-of-vcames-camera-adapter>
compatibility_id=<sha256-of-canonical-fields-described-in-docs/DEVICE-PROFILING.md>
