# Exact-build manifest generated from a ROOT diagnostic report. Every field is
# mandatory when packaging a front/back replacement adapter.
vendor_family=xiaomi
soc_family=qualcomm
camera_hal_transport=hidl
manufacturer=Xiaomi
product=<ro.product.name>
device=<ro.product.device>
api=33
system_fingerprint_sha256=<sha256-of-ro.build.fingerprint-without-newline>
vendor_fingerprint_sha256=<sha256-of-ro.vendor.build.fingerprint-without-newline>
cameraserver_sha256=<sha256-of-/system/bin/cameraserver>
camera_provider_sha256=<aggregate-sha256-of-provider-files>
vendor_camera_libraries_sha256=<aggregate-sha256-of-relevant-vendor-camera-files>
graphics_stack_sha256=<aggregate-sha256-of-vendor-mapper-and-allocator-files>
adapter_sha256=<sha256-of-vcames-camera-adapter>
compatibility_id=<sha256-of-canonical-fields-described-in-docs/DEVICE_PROFILING.md>
