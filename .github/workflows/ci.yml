name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v4
      - name: Check shell syntax
        run: |
          bash -n tools/root/build-root-module.sh
          sh -n root-module/template/*.sh
          python3 -m py_compile tools/root/build_device_pack.py
          python3 -m py_compile tools/compatibility-builder/validate_profiles.py
          python3 -m py_compile tools/aosp/pixel5-global-provider/apply_global_provider.py
          ! grep -q 'allow untrusted_app_all magisk:unix_stream_socket connectto' root-module/template/sepolicy.rule
          grep -q 'type_transition magisk vcames_proxy_exec process vcames_proxy' root-module/template/sepolicy.rule
          grep -q 'allow untrusted_app_all vcames_proxy:unix_stream_socket connectto' root-module/template/sepolicy.rule
          ! grep -R -q 'assets/vcames-root-bridge.zip' app/src
      - name: Validate Profile catalog and release gates
        run: |
          python3 -m json.tool profiles/schema/profile-v2.schema.json >/dev/null
          python3 -m json.tool profiles/schema/ffmpeg-license-v1.schema.json >/dev/null
          python3 -m json.tool profiles/schema/catalog-v1.schema.json >/dev/null
          python3 tools/compatibility-builder/validate_profiles.py profiles/catalog.json
          python3 -m unittest discover -s tools/compatibility-builder/tests -v
          python3 -m unittest discover -s tools/root/tests -v
          python3 -m unittest discover -s tools/aosp/tests -v
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;36.0.0' 'ndk;27.2.12479018'
      - name: Gradle build and lint
        run: >-
          ./gradlew --no-daemon
          :app:assembleDebug :app:lintDebug
      - name: Build the user APK and fail-closed runtime skeleton
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          ./tools/root/build-root-module.sh 30
          runtime=out/developer/VCamES-Pixel5-Runtime-API30.zip
          unzip -t "$runtime"
          unzip -Z1 "$runtime" | grep -Fx module.prop
          unzip -Z1 "$runtime" | grep -Fx bridge.properties
          unzip -Z1 "$runtime" | grep -Fx device-probe.sh
          . ./version.properties
          apk="out/release/VCamES-$versionName.apk"
          test "$(unzip -p "$runtime" module.prop | sed -n 's/^versionCode=//p' | tr -d '\r')" = "$versionCode"
          test "$(unzip -p "$runtime" bridge.properties | sed -n 's/^daemon_protocol=//p' | tr -d '\r')" = "$daemonProtocol"
          test "$(unzip -p "$runtime" bridge.properties | sed -n 's/^controller_apk_sha256=//p' | tr -d '\r')" = "$(sha256sum "$apk" | cut -d' ' -f1)"
          unzip -Z1 "$runtime" | grep -Fx bin/vcamesd
          unzip -Z1 "$runtime" | grep -Fx bin/vcames-socket-proxy
          ! unzip -Z1 "$runtime" | grep -Eq 'controller\.apk|boot\.img|(^|/)(su|magisk|kernelsu)(/|$)'
          ! unzip -Z1 "$runtime" | grep -Eq 'v4l2loopback\.ko|vcames-global-camera-provider|(^|/)ffmpeg$'
          ! unzip -Z1 "$apk" | grep -q 'assets/vcames-root-bridge.zip'
      - uses: actions/upload-artifact@v7
        with:
          name: vcames-debug-apk
          path: out/release/*.apk
      - uses: actions/upload-artifact@v7
        with:
          name: vcames-runtime-skeleton
          path: |
            out/developer/VCamES-Pixel5-Runtime-API30.zip

  native-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Configure
        run: cmake -S daemon -B out/host -G Ninja
      - name: Build
        run: cmake --build out/host
      - name: Test
        run: ctest --test-dir out/host --output-on-failure
