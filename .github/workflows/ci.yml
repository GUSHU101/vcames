name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v4
      - name: Check shell syntax
        run: |
          sh -n tools/root/build-root-module.sh root-module/template/*.sh
          python3 -m py_compile tools/root/build_device_pack.py
          ! grep -q 'allow untrusted_app_all magisk:unix_stream_socket connectto' root-module/template/sepolicy.rule
          grep -q 'memory_access=read-only' daemon/src/shared_frame_bus.cpp
          ! grep -R -q 'target == "external"\|/dev/video100\|v4l2loopback' app/src daemon/src daemon/include root-module/template
      - name: Validate Profile catalog and release gates
        run: |
          python3 -m json.tool profiles/schema/profile-v1.schema.json >/dev/null
          python3 -m json.tool profiles/schema/catalog-v1.schema.json >/dev/null
          python3 tools/compatibility-builder/validate_profiles.py profiles/catalog.json
          python3 -m unittest discover -s tools/compatibility-builder/tests -v
          python3 -m unittest discover -s tools/root/tests -v
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;36.0.0' 'ndk;27.2.12479018'
      - name: Gradle build and lint
        run: >-
          ./gradlew --no-daemon
          :app:assembleDebug :app:lintDebug
      - name: Build the single user APK and developer Root Bridge
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          ./tools/root/build-root-module.sh 30
          unzip -t out/developer/VCamES-Root-API30.zip
          unzip -Z1 out/developer/VCamES-Root-API30.zip | grep -Fx module.prop
          unzip -Z1 out/developer/VCamES-Root-API30.zip | grep -Fx bridge.properties
          unzip -Z1 out/developer/VCamES-Root-API30.zip | grep -Fx device-probe.sh
          . ./version.properties
          test "$(unzip -p out/developer/VCamES-Root-API30.zip module.prop | sed -n 's/^versionCode=//p' | tr -d '\r')" = "$versionCode"
          test "$(unzip -p out/developer/VCamES-Root-API30.zip bridge.properties | sed -n 's/^daemon_protocol=//p' | tr -d '\r')" = "$daemonProtocol"
          unzip -Z1 out/developer/VCamES-Root-API30.zip | grep -Fx bin/vcamesd
          unzip -Z1 out/developer/VCamES-Root-API30.zip | grep -Fx bin/vcames-socket-proxy
          ! unzip -Z1 out/developer/VCamES-Root-API30.zip | grep -Eq 'controller.apk|video100|v4l2|external-camera-provider'
          unzip -Z1 "out/release/VCamES-$versionName.apk" | grep -Fx assets/vcames-root-bridge.zip
      - uses: actions/upload-artifact@v7
        with:
          name: vcames-debug-apk
          path: out/release/*.apk
      - uses: actions/upload-artifact@v7
        with:
          name: vcames-root-bridge
          path: |
            out/developer/VCamES-Root-API30.zip

  native-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Configure
        run: cmake -S daemon -B out/host -G Ninja
      - name: Build
        run: cmake --build out/host
      - name: Test
        run: ctest --test-dir out/host --output-on-failure
