name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v4
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;36.0.0'
      - name: Gradle build and lint
        run: ./gradlew --no-daemon :app:assembleDebug :app:lintDebug
      - uses: actions/upload-artifact@v7
        with:
          name: vcames-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  native-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake -S daemon -B out/host -G Ninja
      - name: Build
        run: cmake --build out/host
      - name: Test
        run: ctest --test-dir out/host --output-on-failure
